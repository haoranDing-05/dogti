<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>DogTi · 测测你的狗系人格</title>
<meta name="description" content="18道题，测测你是边牧、金毛还是哈士奇……狗系人格测试，汪汪！">
<meta property="og:title" content="DogTi · 测测你的狗系人格">
<meta property="og:description" content="18道题，测测你是哪种小狗！">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐶</text></svg>">
<style>
:root{
  --bg:#FFF7EC; --card:#FFFFFF; --ink:#4A332A; --ink2:#9A7B66;
  --accent:#FF9F43; --accent2:#FF7A59; --line:#F3E3CC; --cream:#FDF1DE;
  --shadow:0 8px 24px rgba(160,110,60,.12);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","HarmonyOS Sans SC","Source Han Sans SC","Microsoft YaHei",sans-serif;
  background:var(--bg); color:var(--ink); overflow-x:hidden;
  background-image:radial-gradient(circle at 15% 20%, rgba(255,180,90,.08), transparent 40%),
                   radial-gradient(circle at 85% 75%, rgba(255,140,90,.07), transparent 40%);
}
#app{max-width:520px;margin:0 auto;min-height:100vh;position:relative}
.screen{display:none;min-height:100vh;padding:28px 22px 40px;flex-direction:column;animation:fade .35s ease}
.screen.active{display:flex}
@keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.04)}100%{transform:scale(1);opacity:1}}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
@keyframes wag{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(6deg)}}
@keyframes sniff{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(4px) scale(1.05)}}

/* ---------- 通用 ---------- */
.btn{
  display:block;width:100%;border:none;cursor:pointer;font-family:inherit;
  background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;
  font-size:17px;font-weight:700;padding:16px;border-radius:18px;letter-spacing:1px;
  box-shadow:0 6px 16px rgba(255,140,60,.35);transition:transform .15s;
}
.btn:active{transform:scale(.96)}
.btn.ghost{background:#fff;color:var(--ink);border:2px solid var(--line);box-shadow:none;font-weight:600}
.linkrow{display:flex;gap:10px;margin-top:12px}
.linkrow .btn{margin-top:0}
.mini-link{background:none;border:none;color:var(--ink2);font-size:13px;cursor:pointer;text-decoration:underline;padding:6px;font-family:inherit}

/* ---------- 封面 ---------- */
#cover{align-items:center;text-align:center;justify-content:center}
.cover-dogs{width:300px;max-width:88vw;animation:floaty 4s ease-in-out infinite}
.logo{font-size:52px;font-weight:900;letter-spacing:2px;margin-top:6px;
  background:linear-gradient(135deg,#FF9F43,#FF7A59);-webkit-background-clip:text;background-clip:text;color:transparent}
.logo-sub{font-size:15px;color:var(--ink2);margin:8px 0 4px;letter-spacing:1px}
.cover-tag{font-size:13px;color:#B89B82;margin-bottom:24px}
.cover-count{margin-top:18px;font-size:13px;color:var(--ink2);background:#fff;
  padding:8px 18px;border-radius:999px;border:1.5px solid var(--line)}
.cover-count b{color:var(--accent2)}
.cover-links{margin-top:14px;display:flex;gap:16px}
.paw-deco{position:absolute;font-size:22px;opacity:.18;animation:floaty 5s ease-in-out infinite}

/* ---------- 答题 ---------- */
.q-top{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.q-back{background:#fff;border:2px solid var(--line);border-radius:12px;width:38px;height:38px;
  font-size:16px;cursor:pointer;color:var(--ink)}
.q-progress{flex:1;height:12px;background:#fff;border-radius:999px;border:1.5px solid var(--line);overflow:hidden}
.q-fill{height:100%;width:0%;border-radius:999px;transition:width .3s ease;
  background:linear-gradient(90deg,var(--accent),var(--accent2))}
.q-num{font-size:13px;color:var(--ink2);font-weight:700;min-width:44px;text-align:right}
.q-dog{width:120px;margin:6px auto 0;animation:wag 3s ease-in-out infinite;transform-origin:bottom center}
.q-label{display:inline-block;align-self:center;background:var(--cream);color:#C98A3D;font-size:13px;
  font-weight:700;padding:6px 16px;border-radius:999px;margin:10px 0 12px;letter-spacing:1px}
.q-title{font-size:21px;font-weight:800;text-align:center;line-height:1.5;margin-bottom:24px;padding:0 4px}
.opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:#fff;
  border:2px solid var(--line);border-radius:16px;padding:15px 16px;margin-bottom:12px;
  font-size:15.5px;color:var(--ink);cursor:pointer;font-family:inherit;line-height:1.45;
  transition:all .18s;box-shadow:0 2px 6px rgba(160,110,60,.05)}
.opt:active{transform:scale(.98)}
.opt .dot{width:22px;height:22px;border-radius:50%;border:2.5px solid var(--line);flex-shrink:0;
  display:flex;align-items:center;justify-content:center;font-size:12px;transition:all .18s}
.opt.pick{border-color:var(--accent);background:#FFF3E3;box-shadow:0 4px 12px rgba(255,159,67,.25)}
.opt.pick .dot{background:var(--accent);border-color:var(--accent);color:#fff}
.opt.pick .dot::after{content:"🐾";font-size:11px}

/* ----------  sniff 加载 ---------- */
#sniff{align-items:center;justify-content:center;text-align:center}
.sniff-dog{width:180px;animation:sniff .7s ease-in-out infinite}
.sniff-txt{margin-top:20px;font-size:16px;color:var(--ink2);font-weight:600;letter-spacing:1px}

/* ---------- 结果 ---------- */
.res-card{background:var(--card);border-radius:26px;box-shadow:var(--shadow);overflow:hidden;
  animation:pop .5s ease}
.res-banner{padding:26px 20px 18px;text-align:center;position:relative}
.res-dog{width:190px;margin:0 auto;animation:floaty 4.5s ease-in-out infinite}
.res-name{font-size:34px;font-weight:900;margin-top:4px;letter-spacing:2px}
.res-title{font-size:15px;color:var(--ink2);font-weight:700;margin-top:4px}
.res-code{display:inline-block;margin-top:10px;background:rgba(255,255,255,.75);border-radius:999px;
  padding:5px 16px;font-size:13px;font-weight:800;letter-spacing:2px;color:#7A5A3A}
.res-body{padding:20px 22px 24px}
.res-tags{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-bottom:14px}
.tag{background:var(--cream);color:#C0762C;font-size:12.5px;font-weight:700;padding:5px 13px;border-radius:999px}
.res-desc{font-size:14.5px;line-height:1.85;color:#6B4E3C;background:#FFFBF4;border-radius:16px;
  padding:16px;border:1.5px dashed #EFD9B8}
.axes{margin-top:18px}
.axes h4,.rel h4{font-size:14px;color:var(--ink2);margin-bottom:10px;letter-spacing:2px}
.axis-row{display:flex;align-items:center;gap:8px;margin-bottom:10px;font-size:12px;font-weight:700}
.axis-pole{width:62px;color:var(--ink2)}
.axis-pole.win{color:var(--accent2);font-size:12.5px}
.axis-pole.r{text-align:right}
.axis-track{flex:1;height:10px;background:#F4E8D4;border-radius:999px;position:relative;overflow:hidden}
.axis-fill{position:absolute;top:0;bottom:0;border-radius:999px;
  background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width .8s ease}
.axis-pct{width:66px;font-size:11px;color:#B89B82;text-align:center}
.rel{margin-top:18px}
.rel-row{display:flex;gap:10px}
.rel-card{flex:1;background:#FFFBF4;border:1.5px solid var(--line);border-radius:16px;padding:12px;
  display:flex;align-items:center;gap:10px}
.rel-card svg{width:52px;height:52px;flex-shrink:0}
.rel-k{font-size:11px;color:var(--ink2);font-weight:700}
.rel-n{font-size:13.5px;font-weight:800;margin:2px 0}
.rel-c{font-size:11px;color:#B89B82}
.res-actions{margin-top:20px}
.share-hint{font-size:12px;color:#B89B82;text-align:center;margin-top:10px}
.paw-rain{position:absolute;top:0;font-size:18px;opacity:0;animation:fall linear forwards}
@keyframes fall{0%{opacity:0;transform:translateY(-20px) rotate(0)}15%{opacity:.7}100%{opacity:0;transform:translateY(120vh) rotate(340deg)}}

/* ---------- 图鉴 / 统计 ---------- */
.page-head{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.page-title{font-size:22px;font-weight:900;flex:1}
.g-card{background:#fff;border-radius:20px;padding:16px;margin-bottom:14px;box-shadow:var(--shadow);
  border:1.5px solid var(--line)}
.g-head{display:flex;align-items:center;gap:12px}
.g-head svg{width:64px;height:64px}
.g-name{font-size:17px;font-weight:900}
.g-t{font-size:12.5px;color:var(--accent2);font-weight:700;margin:2px 0 5px}
.g-tags{display:flex;gap:6px;flex-wrap:wrap}
.g-tag{font-size:11px;background:var(--cream);color:#C0762C;padding:3px 9px;border-radius:999px;font-weight:700}
.g-desc{font-size:13px;line-height:1.8;color:#7A5A44;margin-top:10px}
.g-rel{font-size:11.5px;color:#B89B82;margin-top:8px}
.stat-total{background:linear-gradient(135deg,#FF9F43,#FF7A59);border-radius:22px;color:#fff;
  text-align:center;padding:24px;margin-bottom:18px;box-shadow:0 8px 20px rgba(255,140,60,.3)}
.stat-num{font-size:44px;font-weight:900}
.stat-label{font-size:13px;opacity:.9;margin-top:2px}
.stat-row{display:flex;align-items:center;gap:10px;background:#fff;border-radius:16px;
  padding:10px 14px;margin-bottom:10px;border:1.5px solid var(--line)}
.stat-row svg{width:42px;height:42px;flex-shrink:0}
.stat-info{flex:1}
.stat-name{font-size:13.5px;font-weight:800}
.stat-bar{height:8px;background:#F4E8D4;border-radius:999px;margin-top:6px;overflow:hidden}
.stat-fill{height:100%;border-radius:999px;width:0;transition:width .6s ease}
.stat-n{font-size:13px;font-weight:800;color:var(--accent2);min-width:34px;text-align:right}
.stat-note{text-align:center;font-size:12px;color:#B89B82;margin-top:14px;line-height:1.8}

/* ---------- 分享结果页 ---------- */
#shared{align-items:center;justify-content:center;text-align:center}
.shared-card{background:#fff;border-radius:26px;box-shadow:var(--shadow);padding:26px 22px;width:100%;
  animation:pop .5s ease}
.shared-from{font-size:13px;color:var(--ink2);margin-bottom:10px}
.shared-dog{width:170px;margin:0 auto}
.shared-actions{margin-top:20px;width:100%}
</style>
</head>
<body>
<div id="app">

  <!-- 封面 -->
  <section class="screen active" id="cover">

  <!-- 答题 -->

  <!-- 结果 -->
  <section class="screen" id="result">
    <div class="res-card">
      <div class="res-banner" id="banner">
        <svg class="res-dog" id="resDog" viewBox="0 0 240 240"></svg>
        <div class="res-name" id="resName"></div>

        <div class="res-code" id="resCode"></div>

        <div class="res-tags" id="resTags"></div>

        <div class="rel"><h4>🐕 狗缘关系</h4><div class="rel-row" id="relRow"></div></div>
        <div class="res-actions">
          <button class="btn" id="shareBtn">分享给朋友 🐾</button>
          <div class="share-hint">分享链接会带上你的狗格，朋友点开就能看到</div>
          <div class="linkrow">
            <button class="btn ghost" id="againBtn">再测一次</button>
            <button class="btn ghost" id="galleryBtn">狗狗图鉴</button>
          </div>
          <div style="text-align:center;margin-top:6px">
            <button class="mini-link" id="resStats">📊 看看大家都测出了啥</button>
          </div>
        </div>
      </div>
    </div>
  </section>

  <!-- 图鉴 -->
  <section class="screen" id="gallery">
    <div class="page-head">
      <button class="q-back" id="galleryBack">←</button>
      <div class="page-title">狗狗图鉴 🐕</div>
    </div>
    <div id="galleryList"></div>
  </section>

  <!-- 统计 -->
  <section class="screen" id="stats">
    <div class="page-head">
      <button class="q-back" id="statsBack">←</button>
      <div class="page-title">汪汪统计局 📊</div>
    </div>
    <div class="stat-total">

    <div id="statList"><div class="stat-note">数据嗅探中…</div></div>
    <div class="stat-note">每完成一次测试实时计入<br>把链接发给朋友，来这里看狗格分布</div>
  </section>

  <!-- 朋友分享来的结果 -->
  <section class="screen" id="shared">
    <div class="shared-card">

</div>

const NS="dogti-quiz-v1";
function cntURL(name,inc){return `https://counterapi.com/api/${NS}/done/${name}${inc?"":"?readOnly=true"}`}
function hit(name){try{fetch(cntURL(name,true)).catch(()=>{})}catch(e){}}
function readCnt(name){
  return new Promise(res=>{
    const cb="_dogti_"+Math.random().toString(36).slice(2);
    const t=setTimeout(()=>{cleanup();res(null)},6000);
    function cleanup(){delete window[cb];const s=document.getElementById("jp_"+cb);if(s)s.remove()}
    window[cb]=v=>{clearTimeout(t);cleanup();res(typeof v==="number"?v:(v&&typeof v.value==="number"?v.value:null))};
    const s=document.createElement("script");
    s.id="jp_"+cb;s.src=cntURL(name,false)+(cntURL(name,false).includes("?")?"&":"?")+"callback="+cb;
    s.onerror=()=>{clearTimeout(t);cleanup();res(null)};
    document.body.appendChild(s);
  });
}

/* ==================== 答题 ==================== */
function renderQ(){
  const q=QUIZ[idx];
  $("#progText").textContent=`${idx+1}/${QUIZ.length}`;
  $("#barFill").style.width=`${((idx+1)/QUIZ.length)*100}%`;
  $("#qLabel").textContent=q.label;
  $("#qTitle").textContent=q.title;
  $("#prevBtn").style.visibility=idx===0?"hidden":"visible";
  $("#qDog").innerHTML=dogSVG(ORDER[idx%ORDER.length]);
  const box=$("#opts");box.innerHTML="";picked=null;
  q.opts.forEach(([txt,pole])=>{
    const b=document.createElement("button");b.className="opt";
    b.innerHTML=`<span class="dot"></span><span>${txt}</span>`;
    b.onclick=()=>{
      if(picked!==null)return;picked=pole;
      box.querySelectorAll(".opt").forEach(o=>o.classList.remove("pick"));
      b.classList.add("pick");
      answers[idx]=pole;addScore(pole,1);
      setTimeout(()=>{idx++;idx<QUIZ.length?renderQ():finish()},280);
    };
    box.appendChild(b);
  });
}
function addScore(pole,dir){
  if(pole==="M"){const ax=axisOf(idx);score[ax[0]]+=1*dir;score[ax[1]]+=1*dir}
  else score[pole]+=2*dir;
}
function axisOf(qi){
  const n=QUIZ[qi].opts.find(o=>o[1]!=="M")[1];
  const ax=AXES.find(x=>x.a===n||x.b===n);
  return ax?[ax.a,ax.b]:null;
}
$("#prevBtn").onclick=()=>{
  if(idx===0)return;
  delete answers[idx];idx--;
  const p=answers[idx];if(p){addScore(p,-1);delete answers[idx]}
  renderQ();
};

/* ==================== 结果 ==================== */
function finish(){
  show("sniff");
  $("#sniffDog").innerHTML=dogSVG(ORDER[Math.floor(Math.random()*8)]);
  setTimeout(showResult,900);
}
function computeCode(){
  const def={E:"E",I:"E",T:"F",F:"F",J:"P",P:"P"}; // 平局默认 E / F / P
  return AXES.map(x=>{
    const va=score[x.a],vb=score[x.b];
    if(va===vb)return def[x.a];
    return va>vb?x.a:x.b;
  }).join("");
}
function showResult(){
  const code=computeCode();
  resultKey=ORDER.find(k=>DOGS[k].code===code)||"jinmao";
  const b=DOGS[resultKey];
  localStorage.setItem("dogti_result",resultKey);
  $("#banner").style.background=`linear-gradient(180deg,${b.c}33,${b.c}0d 60%,transparent)`;
  $("#resDog").innerHTML=dogSVG(resultKey);
  $("#resName").textContent=b.n;
  $("#resTitle").textContent="—— "+b.t;
  $("#resCode").textContent="狗格码 "+b.code;
  $("#resTags").innerHTML=b.tags.map(t=>`<span class="tag">${t}</span>`).join("");
  $("#resDesc").textContent=b.d;
  renderAxes();
  const p=DOGS[b.pair],r=DOGS[b.rival];
  $("#relRow").innerHTML=`
    <div class="rel-card"><svg viewBox="0 0 240 240">${dogSVG(b.pair)}</svg><div><div class="rel-k">最佳拍档</div><div class="rel-n">${p.n}</div><div class="rel-c">${b.pairC}</div></div></div>

  show("result");
  hit("zongrenshu");hit(CNT_KEYS[resultKey]);
  pawRain();
}
function renderAxes(){
  $("#axesBox").innerHTML=AXES.map(x=>{
    const va=score[x.a],vb=score[x.b],tot=Math.max(1,va+vb);
    const pa=Math.round(va/tot*100),pb=100-pa;
    const winA=va>=vb;
    return `<div class="axis-row">
      <span class="axis-pole ${winA?"win":""}">${x.la} ${x.a}</span>
      <div class="axis-track"><div class="axis-fill" style="width:${winA?pa:pb}%;${winA?"left:0":"right:0"}"></div></div>
      <span class="axis-pole r ${winA?"":"win"}">${x.b} ${x.lb}</span>
      <span class="axis-pct">${winA?pa:pb}%</span>
    </div>`;
  }).join("");
}
function pawRain(){
  for(let i=0;i<14;i++){
    const s=document.createElement("span");
    s.className="paw-rain";s.textContent="🐾";
    s.style.left=Math.random()*100+"vw";
    s.style.animationDuration=(2.2+Math.random()*2)+"s";
    s.style.animationDelay=(Math.random()*1.2)+"s";
    s.style.fontSize=(13+Math.random()*14)+"px";
    document.body.appendChild(s);
    setTimeout(()=>s.remove(),5200);
  }
}

function baseURL(){return location.origin+location.pathname}
function copyText(t){
  return new Promise((res,rej)=>{
    if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(res).catch(rej)}
    else{const ta=document.createElement("textarea");ta.value=t;ta.style.cssText="position:fixed;opacity:0";document.body.appendChild(ta);ta.select();try{document.execCommand("copy");res()}catch(e){rej(e)}ta.remove()}
  });
}

      <div><div class="g-name">${b.n} <span style="font-size:12px;color:#B89B82">${b.code}</span></div>
      <div class="g-t">${b.t}</div>
      <div class="g-tags">${b.tags.map(t=>`<span class="g-tag">${t}</span>`).join("")}</div></div></div>
      <div class="g-desc">${b.d}</div>
      <div class="g-rel">最佳拍档：${p.n}（${b.pairC}）｜欢喜冤家：${r.n}（${b.rivalC}）</div></div>`;
  }).join("");
}

/* ==================== 统计局 ==================== */
let statsBusy=false;
async function renderStats(){
  if(statsBusy)return;statsBusy=true;
  $("#statTotal").textContent="…";
  $("#statList").innerHTML=`<div class="stat-note">数据嗅探中…</div>`;
  const total=await readCnt("zongrenshu");
  $("#statTotal").textContent=total===null?"—":total;
  const rows=[];
  for(const k of ORDER){
    const v=await readCnt(CNT_KEYS[k]);
    rows.push([k,v===null?0:v]);
    await new Promise(r=>setTimeout(r,480)); // 限流 2QPS
  }
  const max=Math.max(1,...rows.map(r=>r[1]));
  $("#statList").innerHTML=rows.map(([k,v])=>{
    const b=DOGS[k];
    return `<div class="stat-row"><svg viewBox="0 0 240 240">${dogSVG(k)}</svg>
      <div class="stat-info"><div class="stat-name">${b.n} · ${b.t}</div>
      <div class="stat-bar"><div class="stat-fill" style="background:${b.c};width:${Math.round(v/max*100)}%"></div></div></div>
      <div class="stat-n">${v}</div></div>`;
  }).join("");
  statsBusy=false;
}

/* ==================== 封面 ==================== */
function renderCover(){
  const picks=["jinmao","bianmu","hashiqi","keji"];
  $("#coverDogs").setAttribute("viewBox","0 0 444 240");
  $("#coverDogs").innerHTML=`
    <ellipse cx="222" cy="224" rx="180" ry="12" fill="#F0DFC5"/>
    ${picks.map((k,i)=>`<g transform="translate(${6+i*86},${28+(i%2)*16}) scale(0.72)"><svg width="240" height="240" viewBox="0 0 240 240">${dogSVG(k)}</svg></g>`).join("")}
    <text x="222" y="24" text-anchor="middle" font-size="19" fill="#D9B98F">🦴 🐾 🦴 🐾</text>`;
  readCnt("zongrenshu").then(v=>{
    $("#coverCount").innerHTML=v===null?"已有好多小狗测过啦":"已有 <b>"+v+"</b> 只小狗完成测试";
  });
  const last=localStorage.getItem("dogti_result");
  if(last&&DOGS[last])$("#lastRes").textContent=`你上次测出了「${DOGS[last].n}·${DOGS[last].t}」`;
}

/* ==================== 事件绑定 ==================== */
$("#startBtn").onclick=()=>{resetScore();answers={};idx=0;renderQ();show("quiz")};
$("#againBtn").onclick=()=>{resetScore();answers={};idx=0;renderQ();show("quiz")};
$("#galleryBtn").onclick=()=>{renderGallery();show("gallery")};
$("#coverGallery").onclick=()=>{renderGallery();show("gallery")};
$("#galleryBack").onclick=()=>{show(sharedFrom?"shared":"cover");if(!sharedFrom)renderCover()};
$("#coverStats").onclick=()=>{show("stats");renderStats()};
$("#resStats").onclick=()=>{show("stats");renderStats()};
$("#statsBack").onclick=()=>{show(resultKey?"result":"cover")};
$("#sharedGo").onclick=()=>{sharedFrom=null;history.replaceState(null,"",baseURL());resetScore();answers={};idx=0;renderQ();show("quiz")};
$("#sharedGallery").onclick=()=>{renderGallery();show("gallery")};

/* ==================== 入口：检查是否朋友分享 ==================== */
(function init(){
  const r=new URLSearchParams(location.search).get("r");
  if(r&&DOGS[r]){
    sharedFrom=r;const b=DOGS[r];
    $("#sharedDog").innerHTML=dogSVG(r);
    $("#sharedName").textContent=b.n;
    $("#sharedTitle").textContent="—— "+b.t;
    $("#sharedCode").textContent="狗格码 "+b.code;
    $("#sharedTags").innerHTML=b.tags.map(t=>`<span class="tag">${t}</span>`).join("");
    show("shared");
  }else{
    renderCover();
  }
})();
</script>
